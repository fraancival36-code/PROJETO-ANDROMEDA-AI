<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

        html, body { width: 100%; height: 100%; overflow: hidden; background: #050515; font-family: sans-serif; color: white; }

        .status { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,20,60,0.8); border: 1px solid #00ccff; border-radius: 16px; padding: 6px 15px; font-size: 11px; z-index: 40; }
        .verde { color: #00ff88; } .laranja { color: #ffcc00; }
        .caixa-chave { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 320px; padding: 20px; background: rgba(0,20,60,0.95); border: 2px solid #00ccff; border-radius: 14px; z-index: 50; box-shadow: 0 0 30px rgba(0,204,255,0.4); }
        .caixa-chave h3 { text-align: center; margin-bottom: 12px; color: #66ddff; }
        .caixa-chave input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0088cc; background: rgba(0,30,60,0.9); color: white; font-size: 11px; margin-bottom: 10px; }
        .caixa-chave button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: linear-gradient(90deg,#008844,#00aa55); color: white; font-weight: bold; cursor: pointer; font-size: 13px; }
        .caixa-chave.escondida { display: none; }
        .menu-esquerdo,.menu-direito { position: absolute; bottom: 110px; background: rgba(0,30,80,0.6); border: 1px solid rgba(0,204,255,0.4); border-radius: 12px; padding: 8px 6px; width: 130px; z-index: 10; }

        .menu-esquerdo button:hover,.menu-direito button:hover { background: rgba(0,136,204,0.3); }
        .caixa-vc,.caixa-ela { position: absolute; bottom: 35px; width: calc(50% - 160px); height: 65px; background: rgba(0,25,60,0.75); border: 1px solid rgba(0,204,255,0.4); border-radius: 10px; padding: 8px; color: #99ccff; font-size: 11px; line-height: 1.4; z-index: 20; overflow-y: auto; }
        .caixa-vc { left: 150px; } .caixa-ela { right: 150px; color: #cce4ff; }
        .mic { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle,#0099ff,#0033aa); border: 3px solid #aaddff; box-shadow: 0 0 25px rgba(0,136,204,0.6); display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; cursor: pointer; z-index: 30; }
        .mic.gravando { background: radial-gradient(circle,#ff4488,#aa1155); box-shadow: 0 0 35px rgba(255,68,136,0.8); animation: pulso .6s infinite alternate; }
        @keyframes pulso { from{box-shadow:0 0 15px rgba(255,68,136,.5)} to{box-shadow:0 0 35px rgba(255,68,136,.9)} }
    </style>
</head>
