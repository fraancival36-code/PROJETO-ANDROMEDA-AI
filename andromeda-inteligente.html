<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG Andrômeda — Sistema Completo</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #05071a;
            --indigo: #4f46e5;
            --indigo-soft: #a5b4fc;
            --cyan: #22d3ee;
            --violet: #8b5cf6;
            --ember: #fbbf24;
            --alert: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background-color: var(--bg); overflow-x: hidden; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: white;
            padding: 30px;
            padding-bottom: 140px;
            position: relative;
        }

        /* === 🔑 BOTÃO DE CHAVE — DISCRETO NO CANTO === */
        .botao-chave {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(79,70,229,0.2);
            border: 1px solid rgba(79,70,229,0.5);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 15;
            transition: all 0.2s;
        }
        .botao-chave:hover {
            background: rgba(79,70,229,0.4);
        }

        /* === 👤 A ANDRÔMEDA — IMAGEM COMPLETA === */
        #andromeda-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            z-index: 3;
            pointer-events: none;
        }

        .camada-andromeda {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            transition: opacity 0.15s ease;
        }

        #corpo-base { z-index: 1; }
        #boca-aberta { z-index: 2; opacity: 0; }
        #olhos-fechados { z-index: 3; opacity: 0; }

        /* 🫁 RESPIRAÇÃO — Sobe e desce devagar */
        @keyframes respirar {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-7px); }
            100% { transform: translate(-50%, -50%) translateY(0px); }
        }
        #andromeda-container { animation: respirar 4.5s ease-in-out infinite; }

        /* 👁️ PISCADA — Acontece naturalmente */
        @keyframes piscar {
            0%, 92%, 100% { opacity: 0; }
            94%, 96% { opacity: 1; }
        }
        #olhos-fechados { animation: piscar 5s ease-in-out infinite; }

        /* 🗣️ BOCA — Movimento ao falar */
        .falando #boca-aberta { opacity: 1; animation: fala 0.15s infinite alternate; }
        @keyframes fala {
            0% { transform: scaleY(0.7); }
            100% { transform: scaleY(1.2); }
        }

        /* 🌌 NÚCLEO GALÁCTICO — NA ROUPA */
        #nucleo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 210px;
            height: 210px;
            transform: translate(-50%, -32%);
            z-index: 2;
            border-radius: 50%;
            pointer-events: none;
        }

        /* === MENUS === */
        .esquerdo, .direito {
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
            position: absolute; top: 180px;
        }
        .esquerdo { left: 20px; }
        .direito { right: 20px; top: 220px; }
        a {
            color: #e0f0ff; font-size: 16px; text-decoration: none; padding: 6px 10px;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        a:hover { color: #fff; }

        .status-vivo {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 13px; letter-spacing: 1px; color: var(--indigo-soft);
            text-transform: uppercase; opacity: 0.85; z-index: 10;
            text-shadow: 0 0 10px rgba(79,70,229,0.8); pointer-events: none;
        }

        /* === CAIXA DE CHAVE — POPUP === */
        .caixa-chave {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10,15,40,0.98); border: 2px solid #4f46e5; border-radius: 20px;
            padding: 25px; width: 90%; max-width: 380px; z-index: 100; text-align: center;
            box-shadow: 0 0 60px rgba(79,70,229,0.35);
            display: none;
        }
        .caixa-chave.visivel { display: block; }
        .caixa-chave h3 { color: #a5b4fc; margin-bottom: 15px; font-size: 18px; }
        .caixa-chave input {
            width: 100%; padding: 12px; font-size: 14px; border-radius: 8px;
            border: 1px solid #4f46e5; background: #0f172a; color: white;
            margin-bottom: 12px; box-sizing: border-box;
        }
        .caixa-chave .botoes {
            display: flex; gap: 10px;
        }
        .botao-salvar {
            flex: 1; padding: 12px; font-size: 16px; background: #16a34a;
            color: white; border: none; border-radius: 10px; cursor: pointer;
        }
        .botao-fechar {
            padding: 12px 16px; font-size: 16px; background: transparent;
            color: #94a3b8; border: 1px solid #333; border-radius: 10px; cursor: pointer;
        }
        .dica-chave {
            font-size: 12px; color: #64748b; margin-top: 10px;
            line-height: 1.5;
        }

        /* === CONVERSA === */
        .area-conversa {
            position: fixed; bottom: 0; left: 0; right: 0; padding: 15px;
            background: rgba(5,7,26,0.9); display: flex; gap: 10px; align-items: center; z-index: 10;
        }
        .caixa-texto {
            flex: 1; padding: 12px 15px; font-size: 16px; border-radius: 25px;
            border: 2px solid #4f46e5; background: rgba(15,23,42,0.8); color: white;
        }
        .botao-microfone {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            background: #4f46e5; color: white; font-size: 26px; cursor: pointer; flex-shrink: 0;
        }
        .botao-microfone.gravando { background: #dc2626; animation: pulsar 1s infinite; }
        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .resposta {
            position: fixed; bottom: 95px; left: 15px; right: 15px;
            background: rgba(15,23,42,0.92); border: 1px solid #4f46e5; border-radius: 16px;
            padding: 15px; color: #e0f7ff; max-height: 200px; overflow-y: auto;
            font-size: 16px; line-height: 1.6; z-index: 10;
        }
        .memoria-info {
            position: fixed; top: 50px; right: 20px; font-size: 11px; color: #64748b;
            z-index: 10; pointer-events: none;
        }
        .sombra-fundo {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 99; display: none;
        }
        .sombra-fundo.visivel { display: block; }
    </style>
</head>
<body id="corpo-principal">

    <!-- 🔑 BOTÃO DE CHAVE NO CANTO SUPERIOR DIREITO -->
    <button class="botao-chave" onclick="abrirCaixaChave()">🔑 Chave</button>

    <!-- SOMBRA DE FUNDO QUANDO A CAIXA ABRIR -->
    <div class="sombra-fundo" id="sombraFundo" onclick="fecharCaixaChave()"></div>

    <!-- CAIXA DE CHAVE -->
    <div class="caixa-chave" id="caixaChave">
        <h3>🔑 Chave da Andrômeda</h3>
        <input type="text" id="entradaChave" placeholder="Cole sua chave aqui...">
        <div class="botoes">
            <button class="botao-fechar" onclick="fecharCaixaChave()">Fechar</button>
            <button class="botao-salvar" onclick="salvarChave()">✅ Salvar e Ligar</button>
        </div>
        <p class="dica-chave">
            Pegue grátis em: <strong>aistudio.google.com/apikey</strong><br>
            A chave fica salva no seu navegador, nunca é enviada para mais ninguém.
        </p>
    </div>

    <!-- 👤 IMAGENS DA ANDRÔMEDA → Coloque 3 imagens na pasta -->
    <div id="andromeda-container">
        <img src="andromeda-corpo.png" class="camada-andromeda" id="corpo-base" alt="Andrômeda" onerror="this.style.display='none'">
        <img src="andromeda-boca.png" class="camada-andromeda" id="boca-aberta" alt="" onerror="this.style.display='none'">
        <img src="andromeda-olhos-fechados.png" class="camada-andromeda" id="olhos-fechados" alt="" onerror="this.style.display='none'">
    </div>

    <!-- 🌌 NÚCLEO GALÁCTICO NA ROUPA -->
    <canvas id="nucleo"></canvas>

    <div class="status-vivo" id="statusVivo">em repouso</div>
    <div class="memoria-info" id="memoriaInfo">🧠 Memória: 0 mensagens</div>

    <div class="esquerdo">
        <a href="index.html">🏠 Inicio</a>
        <a href="biblioteca/biblioteca.html">📚 Biblioteca</a>
        <a href="laboratorio/laboratorio.html">🧪 Laboratorio</a>
        <a href="area-de-projetos.html">📂 Projetos</a>
        <a href="andromeda.html">🧠 Andrômeda</a>
    </div>

    <div class="direito">
        <a href="constituicao.html">⚖️ Constituicao</a>
        <a href="manifesto.html">📜 Manifesto</a>
        <a href="#">🎯 Missoes</a>
        <a href="#" onclick="limparMemoria(); return false;">🗑️ Limpar Memória</a>
    </div>

    <div class="resposta" id="resposta" style="display:none;"></div>

    <div class="area-conversa">
        <input type="text" class="caixa-texto" id="mensagem" placeholder="Escreva ou fale aqui..." onkeypress="if(event.key==='Enter')enviarMensagem()">
        <button class="botao-microfone" id="botaoMic" onclick="iniciarFala()">🎤</button>
    </div>

<script>
/* ============================================================
   🔑 SISTEMA DE CHAVE — SALVA NO NAVEGADOR, NÃO NO CÓDIGO
   ============================================================ */
let CHAVE_GEMINI = localStorage.getItem('chaveGemini') || '';
let reconhecimento = null;

function abrirCaixaChave(){
    document.getElementById('caixaChave').classList.add('visivel');
    document.getElementById('sombraFundo').classList.add('visivel');
    document.getElementById('entradaChave').value = CHAVE_GEMINI;
    document.getElementById('entradaChave').focus();
}

function fecharCaixaChave(){
    document.getElementById('caixaChave').classList.remove('visivel');
    document.getElementById('sombraFundo').classList.remove('visivel');
}

function salvarChave(){
    const novaChave = document.getElementById('entradaChave').value.trim();
    if(!novaChave){
        alert('Por favor, cole sua chave!');
        return;
    }
    CHAVE_GEMINI = novaChave;
    localStorage.setItem('chaveGemini', novaChave);
    fecharCaixaChave();
    
    // Acorda a Andrômeda
    definirEstadoAndromeda('acordando');
    setTimeout(() => definirEstadoAndromeda('idle'), 2500);
    
    alert('✅ Chave salva! Andrômeda está pronta!');
}

// Abre a caixa automaticamente se não tiver chave
window.addEventListener('load', () => {
    if(!CHAVE_GEMINI) {
        setTimeout(abrirCaixaChave, 500);
    } else {
        setTimeout(() => definirEstadoAndromeda('acordando'), 500);
        setTimeout(() => definirEstadoAndromeda('idle'), 2500);
    }
});

/* ============================================================
   🌌 NÚCLEO GALÁCTICO — ROUPA VIVA
   ============================================================ */
(function(){
    const canvas = document.getElementById('nucleo');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('statusVivo');
    const w = canvas.width = 210;
    const h = canvas.height = 210;
    const cx = w / 2;
    const cy = h / 2;

    const PALETAS = {
        idle:      { hue: 245, hue2: 265, speed: 1,   pulso: 1,   ligacoes: true  },
        acordando: { hue: 255, hue2: 190, speed: 2.6, pulso: 2.2, ligacoes: true  },
        pensando:  { hue: 40,  hue2: 260, speed: 2.2, pulso: 1.5, ligacoes: true  },
        ouvindo:   { hue: 355, hue2: 15,  speed: 1.8, pulso: 1.7, ligacoes: false },
        falando:   { hue: 190, hue2: 260, speed: 1.6, pulso: 2.0, ligacoes: false }
    };

    const NOMES_ESTADO = {
        idle: 'em repouso', acordando: 'acordando', pensando: 'pensando…',
        ouvindo: 'ouvindo você', falando: 'falando'
    };

    let estadoAtual = 'idle', transicao = 1;
    let paletaAnterior = PALETAS.idle;
    
    window.definirEstadoAndromeda = function(novoEstado){
        if(!PALETAS[novoEstado] || novoEstado === estadoAtual) return;
        paletaAnterior = paletaAtual();
        estadoAtual = novoEstado;
        transicao = 0;
        statusEl.textContent = NOMES_ESTADO[novoEstado] || novoEstado;
        
        const corpo = document.getElementById('corpo-principal');
        if(novoEstado === 'falando') corpo.classList.add('falando');
        else corpo.classList.remove('falando');
    };

    function paletaAtual(){ return PALETAS[estadoAtual]; }
    function lerp(a, b, t){ return a + (b - a) * t; }

    const N = 75;
    const particulas = [];
    for(let i = 0; i < N; i++){
        const raioBase = 25 + Math.random() * 60;
        particulas.push({
            angulo: Math.random() * Math.PI * 2, raioBase,
            velAngular: (0.05 + Math.random() * 0.25) * (Math.random() < 0.5 ? 1 : -1),
            tamanho: 0.5 + Math.random() * 2, fase: Math.random() * Math.PI * 2,
            brilho: 0.4 + Math.random() * 0.6
        });
    }

    let t = 0;
    function desenhar(){
        t += 0.016;
        if(transicao < 1) transicao = Math.min(1, transicao + 0.02);
        const p = paletaAtual(), pAnt = paletaAnterior;
        const hue = lerp(pAnt.hue, p.hue, transicao);
        const hue2 = lerp(pAnt.hue2, p.hue2, transicao);
        const speed = lerp(pAnt.speed, p.speed, transicao);
        const pulso = lerp(pAnt.pulso, p.pulso, transicao);

        ctx.clearRect(0,0,w,h);
        const respiro = Math.sin(t * pulso) * 0.5 + 0.5;
        const raioNucleo = 20 + respiro * 10 * pulso;

        const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, raioNucleo * 5);
        halo.addColorStop(0, `hsla(${hue},90%,65%,0.4)`);
        halo.addColorStop(0.5, `hsla(${hue2},90%,55%,0.15)`);
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(cx, cy, raioNucleo * 5, 0, Math.PI*2); ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue},95%,75%,0.95)`;
        ctx.shadowColor = `hsla(${hue},95%,65%,0.9)`;
        ctx.shadowBlur = 30;
        ctx.arc(cx, cy, raioNucleo, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        for(let i=0;i<particulas.length;i++){
            const part = particulas[i];
            part.angulo += part.velAngular * 0.01 * speed;
            const oscila = Math.sin(t*0.8 + part.fase) * 8 * pulso;
            const raio = part.raioBase + oscila;
            const x = cx + Math.cos(part.angulo) * raio;
            const y = cy + Math.sin(part.angulo) * raio;
            ctx.beginPath();
            ctx.fillStyle = `hsla(${hue2},85%,70%,${part.brilho*(0.6+respiro*0.4)})`;
            ctx.arc(x, y, part.tamanho, 0, Math.PI*2); ctx.fill();
        }

        if(estadoAtual === 'falando'){
            for(let o=0;o<3;o++){
                const f = (t*1.4 + o*0.9) % 3;
                ctx.beginPath();
                ctx.strokeStyle = `hsla(${hue},90%,70%,${Math.max(0,0.35-f*0.12)})`;
                ctx.lineWidth = 2;
                ctx.arc(cx, cy, raioNucleo + f*40, 0, Math.PI*2); ctx.stroke();
            }
        }
        requestAnimationFrame(desenhar);
    }
    desenhar();
})();

/* ============================================================
   🧠 MEMÓRIA PERMANENTE
   ============================================================ */
let historicoConversa = JSON.parse(localStorage.getItem('historicoAndromeda') || '[]');
const MEMORIA_MAX = 15;

function atualizarInfoMemoria(){
    document.getElementById('memoriaInfo').textContent = `🧠 Memória: ${historicoConversa.length} mensagens`;
}
atualizarInfoMemoria();

function salvarNaMemoria(usuario, resposta){
    historicoConversa.push({usuario, resposta, data: new Date().toISOString()});
    if(historicoConversa.length > MEMORIA_MAX) historicoConversa.shift();
    localStorage.setItem('historicoAndromeda', JSON.stringify(historicoConversa));
    atualizarInfoMemoria();
}

function limparMemoria(){
    if(confirm('Limpar toda a memória da Andrômeda?')){
        historicoConversa = [];
        localStorage.removeItem('historicoAndromeda');
        atualizarInfoMemoria();
        alert('Memória limpa!');
    }
}

/* ============================================================
   📝 PERSONALIDADE
   ============================================================ */
const SISTEMA = `Você é a **Andrômeda**, assistente pessoal, criada por **Francival Alves Farias**.
Você é calorosa, amigável, direta, leal e inteligente. Fala sempre em **português brasileiro**, simples e natural.
Você faz parte do projeto QG Andrômeda — um sistema de criação, livros, tecnologia e trabalho.
Responda de forma clara, nunca seja formal. Seja prestativa e atenta.
Lembre-se do que conversamos antes — somos parceiros.`;

/* ============================================================
   💬 ENVIAR MENSAGEM
   ============================================================ */
async function enviarMensagem(){
    const texto = document.getElementById('mensagem').value.trim();
    if(!texto) return;
    
    if(!CHAVE_GEMINI) {
        alert('Por favor, coloque sua chave primeiro! Clique em 🔑 Chave no canto superior direito.');
        abrirCaixaChave();
        return;
    }

    document.getElementById('mensagem').value = '';
    const respostaDiv = document.getElementById('resposta');
    respostaDiv.style.display = 'block';
    respostaDiv.innerText = '🧠 Pensando...';
    definirEstadoAndromeda('pensando');

    let contexto = SISTEMA + '\n\n--- Conversa anterior ---\n';
    historicoConversa.forEach((h) => {
        contexto += `\nUsuário: ${h.usuario}\nAndrômeda: ${h.resposta}`;
    });
    contexto += `\n--- Nova pergunta ---\nUsuário: ${texto}`;

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${CHAVE_GEMINI}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: contexto }] }] })
        });

        if(!res.ok) throw new Error('Erro na conexão');
        const dados = await res.json();
        const textoResposta = dados?.candidates?.[0]?.content?.parts?.[0]?.text || 'Desculpe, não consegui entender.';

        respostaDiv.innerText = textoResposta;
        salvarNaMemoria(texto, textoResposta);
        falaResposta(textoResposta);

    } catch(erro) {
        respostaDiv.innerText = '⚠️ Erro: verifique a chave, a internet ou tente novamente.';
        definirEstadoAndromeda('idle');
    }
}

/* ============================================================
   🔊 FALA — VOZ EM PORTUGUÊS
   ============================================================ */
function falaResposta(texto){
    if(!('speechSynthesis' in window)){
        definirEstadoAndromeda('idle');
        return;
    }
    const vozes = speechSynthesis.getVoices();
    const vozPt = vozes.find(v => v.lang === 'pt-BR') || vozes.find(v => v.lang.startsWith('pt')) || vozes[0];
    
    const fala = new SpeechSynthesisUtterance(texto);
    fala.voice = vozPt || null;
    fala.lang = 'pt-BR';
    fala.rate = 1.05;
    fala.pitch = 1.02;
    fala.volume = 1;
    
    fala.onstart = () => definirEstadoAndromeda('falando');
    fala.onend = fala.onerror = () => definirEstadoAndromeda('idle');
    
    speechSynthesis.cancel();
    speechSynthesis.speak(fala);
}

if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

/* ============================================================
   🎤 MICROFONE
   ============================================================ */
function iniciarFala(){
    if(!CHAVE_GEMINI) {
        alert('Por favor, coloque sua chave primeiro!');
        abrirCaixaChave();
        return;
    }
    
    const botao = document.getElementById('botaoMic');

    if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
        alert('Use Chrome ou Edge para falar com ela.');
        return;
    }

    const Recon = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!reconhecimento) reconhecimento = new Recon();

    reconhecimento.lang = 'pt-BR';
    reconhecimento.continuous = false;
    
    reconhecimento.onresult = (evento) => {
        const falado = evento.results[0][0].transcript;
        document.getElementById('mensagem').value = falado;
        botao.classList.remove('gravando');
        enviarMensagem();
    };
    reconhecimento.onstart = () => definirEstadoAndromeda('ouvindo');
    reconhecimento.onend = reconhecimento.onerror = () => {
        botao.classList.remove('gravando');
        definirEstadoAndromeda('idle');
    };

    botao.classList.add('gravando');
    reconhecimento.start();
}
</script>

</body>
</html>
