<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Voz — Laboratorio Andromeda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #02040a, #0a071e);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-voltar {
            align-self: flex-start;
            color: #818cf8;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #312e81;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .painel {
            width: 100%;
            max-width: 600px;
            background: rgba(10, 8, 28, 0.95);
            border: 1px solid #6d28d9;
            border-radius: 16px;
            padding: 25px;
        }
        h2 { color: #c084fc; margin-bottom: 15px; font-size: 22px; text-align: center; }
        textarea {
            width: 100%;
            height: 130px;
            background: #020205;
            border: 1px solid #4c1d95;
            border-radius: 10px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 14px;
            resize: none;
            margin-bottom: 15px;
        }
        .linha { margin-bottom: 12px; }
        label { font-size: 13px; color: #a78bfa; display: block; margin-bottom: 5px; }
        select, input[type="range"] {
            width: 100%;
            background: #020205;
            border: 1px solid #4c1d95;
            border-radius: 8px;
            padding: 10px;
            color: #e2e8f0;
        }
        .btn-falar {
            width: 100%;
            background: linear-gradient(90deg, #7c3aed, #db2777);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            background: #020205;
            border-radius: 8px;
            color: #f9a8d4;
            font-family: monospace;
            font-size: 13px;
            text-align: center;
        }
        .navegacao {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .navegacao a {
            color: #818cf8;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            border: 1px solid #312e81;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <a href="../laboratorio.html" class="btn-voltar">← Voltar ao Laboratorio</a>

    <div class="painel">
        <h2>🎙️ Gerador de Voz e Audio</h2>

        <div class="linha">
            <label>Texto para narrar</label>
            <textarea id="texto" placeholder="Cole aqui o trecho do livro..."></textarea>
        </div>

        <div class="linha">
            <label>Voz</label>
            <select id="voz"></select>
        </div>

        <div class="linha">
            <label>Velocidade</label>
            <input type="range" id="velocidade" min="0.6" max="1.4" step="0.1" value="1">
        </div>

        <button class="btn-falar" onclick="falar()">🔊 Ouvir Narracao</button>

        <div class="status" id="status">Aguardando...</div>
    </div>

    <div class="navegacao">
        <a href="../01-VIDEO/gerador-video.html">← Video</a>
        <a href="../laboratorio.html">Laboratorio</a>
        <a href="../03-SIMULADOR/simulador.html">Simulador →</a>
    </div>

<script>
const sintese = window.speechSynthesis;
let vozes = [];

function carregarVozes() {
    vozes = sintese.getVoices();
    const sel = document.getElementById('voz');
    sel.innerHTML = '';
    vozes.filter(v => v.lang.startsWith('pt'))
        .forEach(v => {
            const op = document.createElement('option');
            op.value = v.name;
            op.textContent = v.name;
            sel.appendChild(op);
        });
}
sintese.onvoiceschanged = carregarVozes;
carregarVozes();

function falar() {
    const t = document.getElementById('texto').value.trim();
    if (!t) {
        document.getElementById('status').textContent = '⚠️ Escreva o texto primeiro!';
        return;
    }
    sintese.cancel();
    const f = new SpeechSynthesisUtterance(t);
    const nomeVoz = document.getElementById('voz').value;
    const v = vozes.find(x => x.name === nomeVoz);
    if (v) f.voice = v;
    f.lang = 'pt-BR';
    f.rate = parseFloat(document.getElementById('velocidade').value);
    f.onstart = () => document.getElementById('status').textContent = '🔊 Falando...';
    f.onend = () => document.getElementById('status').textContent = '✅ Concluido!';
    sintese.speak(f);
}
</script>

</body>
</html>
