<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Áudio e Voz — Laboratório Andrômeda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #02040a 0%, #0a071e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 8, 28, 0.95);
            border: 1px solid #6d28d9;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(109, 40, 217, 0.25);
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .topo-geral {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2e1065;
            padding-bottom: 15px;
        }
        .btn-voltar {
            color: #c084fc;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #6d28d9;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(17, 24, 39, 0.4);
        }
        .btn-voltar:hover { background: #2e1065; }
        h1 { font-size: 22px; color: #c084fc; text-transform: uppercase; letter-spacing: 2px; }
        .grupo { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; color: #a78bfa; text-transform: uppercase; font-weight: bold; }
        textarea {
            width: 100%;
            height: 120px;
            background: #020205;
            border: 1px solid #4c1d95;
            border-radius: 10px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 14px;
            resize: none;
        }
        select, input[type="range"] {
            width: 100%;
            background: #020205;
            border: 1px solid #4c1d95;
            border-radius: 10px;
            padding: 10px;
            color: #e2e8f0;
        }
        .opcoes-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-gerar {
            background: linear-gradient(90deg, #7c3aed, #db2777);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .painel-player {
            background: #020205;
            border: 1px solid #2e1065;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .visualizador-ondas {
            height: 120px;
            border: 1px dashed #4c1d95;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .barra-onda {
            width: 6px;
            background: #a855f7;
            border-radius: 3px;
            animation: ondulacao 0.5s infinite alternate;
        }
        @keyframes ondulacao {
            from { height: 10px; }
            to { height: 60px; }
        }
        .controles-reproducao { display: flex; gap: 10px; justify-content: center; }
        .btn-play {
            background: #6d28d9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-parar { background: #db2777; }
        .status-audio {
            font-family: monospace;
            font-size: 12px;
            color: #ec4899;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="topo-geral">
        <h1>🎙️ Voz e Áudio</h1>
        <a href="../laboratorio.html" class="btn-voltar">← Voltar</a>
    </div>

    <div class="painel-controles">
        <div class="grupo">
            <label>Texto para narrar</label>
            <textarea id="texto" placeholder="Cole aqui o texto do livro..."></textarea>
        </div>

        <div class="opcoes-grade">
            <div class="grupo">
                <label>Voz</label>
                <select id="voz"></select>
            </div>
            <div class="grupo">
                <label>Velocidade</label>
                <input type="range" id="velocidade" min="0.6" max="1.4" step="0.1" value="1">
            </div>
        </div>

        <button class="btn-gerar" onclick="falar()">🔊 Ouvir Narração</button>
    </div>

    <div class="painel-player">
        <div class="visualizador-ondas" id="ondas">
            <div class="barra-onda" style="animation-delay: 0s;"></div>
            <div class="barra-onda" style="animation-delay: 0.07s;"></div>
            <div class="barra-onda" style="animation-delay: 0.14s;"></div>
            <div class="barra-onda" style="animation-delay: 0.21s;"></div>
            <div class="barra-onda" style="animation-delay: 0.28s;"></div>
            <div class="barra-onda" style="animation-delay: 0.35s;"></div>
        </div>
        <div class="controles-reproducao">
            <button class="btn-play" onclick="parar()">⏹ Parar</button>
        </div>
        <div class="status-audio" id="status">Aguardando...</div>
    </div>
</div>

<script>
const sintese = window.speechSynthesis;
let vozesCarregadas = [];

function carregarVozes() {
    vozesCarregadas = sintese.getVoices();
    const selecao = document.getElementById('voz');
    selecao.innerHTML = '';
    vozesCarregadas.filter(v => v.lang.startsWith('pt'))
        .forEach(v => {
            const op = document.createElement('option');
            op.value = v.name;
            op.textContent = v.name;
            selecao.appendChild(op);
        });
}
sintese.onvoiceschanged = carregarVozes;
carregarVozes();

function falar() {
    const texto = document.getElementById('texto').value.trim();
    if (!texto) {
        document.getElementById('status').textContent = '⚠️ Escreva algum texto primeiro!';
        return;
    }
    sintese.cancel();
    const fala = new SpeechSynthesisUtterance(texto);
    const nomeVoz = document.getElementById('voz').value;
    const vozEscolhida = vozesCarregadas.find(v => v.name === nomeVoz);
    if (vozEscolhida) fala.voice = vozEscolhida;
    fala.lang = 'pt-BR';
    fala.rate = parseFloat(document.getElementById('velocidade').value);
    fala.onstart = () => document.getElementById('status').textContent = '🔊 Falando...';
    fala.onend = () => document.getElementById('status').textContent = '✅ Concluído!';
    sintese.speak(fala);
}

function parar() {
    sintese.cancel();
    document.getElementById('status').textContent = '⏹ Parado.';
}
</script>

</body>
</html>
