<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Vídeo — Laboratório Andrômeda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #05050a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-voltar {
            align-self: flex-start;
            color: #818cf8;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #312e81;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .btn-voltar:hover { background: #1e1b4b; }
        .painel {
            width: 100%;
            max-width: 600px;
            background: #0b0f19;
            border: 1px solid #4c1d95;
            border-radius: 16px;
            padding: 25px;
        }
        h2 { color: #a78bfa; margin-bottom: 15px; font-size: 22px; }
        p.desc { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
        textarea {
            width: 100%;
            height: 140px;
            background: #02040a;
            border: 1px solid #312e81;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 14px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus { border-color: #8b5cf6; }
        .btn-gerar {
            width: 100%;
            background: linear-gradient(90deg, #6d28d9, #4f46e5);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-gerar:hover { transform: translateY(-2px); }
        .area-resultado {
            margin-top: 20px;
            border: 1px dashed #334155;
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            text-align: center;
            padding: 15px;
        }
        .navegacao {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .navegacao a {
            color: #818cf8;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            border: 1px solid #312e81;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <a href="../laboratorio.html" class="btn-voltar">← Voltar ao Laboratório</a>

    <div class="painel">
        <h2>🎬 Gerador de Vídeo</h2>
        <p class="desc">Cole o trecho do livro abaixo. A Andrômeda vai ler, criar as cenas e gerar o vídeo.</p>

        <textarea id="texto" placeholder="Cole aqui o texto ou capítulo do livro..."></textarea>

        <button class="btn-gerar" onclick="gerar()">🔄 Criar Vídeo</button>

        <div class="area-resultado" id="saida">
            O resultado aparecerá aqui...
        </div>
    </div>

    <div class="navegacao">
        <a href="../laboratorio.html">← Laboratório</a>
        <a href="../02-AUDIO-VOZ/gerador-voz.html">Áudio →</a>
    </div>

<script>
function gerar() {
    const texto = document.getElementById('texto').value.trim();
    const saida = document.getElementById('saida');

    if (!texto) {
        saida.textContent = '⚠️ Cole algum texto do livro primeiro...';
        return;
    }

    saida.innerHTML = '📖 Lendo e entendendo o texto...';

    setTimeout(() => { saida.innerHTML = '🎨 Criando imagens e cenas...'; }, 1800);
    setTimeout(() => { saida.innerHTML = '🎬 Montando e animando cenas...'; }, 3600);
    setTimeout(() => {
        saida.innerHTML = '✅ Vídeo pronto! Conectando a API de geração para baixar o arquivo final.<br><br>Texto analisado: "' + texto.substring(0, 70) + '..."';
    }, 5500);
}
</script>

</body>
</html>
