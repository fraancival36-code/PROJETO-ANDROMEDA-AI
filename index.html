<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG Andrômeda</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #05071a;
        }
        body {
            background: url('andromeda.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            color: white;
            padding: 30px;
            padding-bottom: 140px;
        }
        .esquerdo {
            position: absolute;
            top: 180px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .direito {
            position: absolute;
            top: 220px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        a {
            color: #e0f0ff;
            font-size: 16px;
            text-decoration: none;
            padding: 6px 10px;
        }
        a:hover {
            color: #ffffff;
        }
        .caixa-chave {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 40, 0.95);
            border: 2px solid #4f46e5;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            z-index: 100;
            text-align: center;
        }
        .caixa-chave h2 {
            color: #a5b4fc;
            margin-bottom: 20px;
        }
        .caixa-chave input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #4f46e5;
            background: #0f172a;
            color: white;
            margin-bottom: 15px;
        }
        .botao-ligar {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .area-conversa {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: rgba(5, 7, 26, 0.9);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .caixa-texto {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 25px;
            border: 2px solid #4f46e5;
            background: rgba(15, 23, 42, 0.8);
            color: white;
        }
        .botao-microfone {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #4f46e5;
            color: white;
            font-size: 26px;
            cursor: pointer;
        }
        .botao-microfone.gravando {
            background: #dc2626;
            animation: pulsar 1s infinite;
        }
        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .resposta {
            position: fixed;
            bottom: 95px;
            left: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #4f46e5;
            border-radius: 16px;
            padding: 15px;
            color: #e0f7ff;
            max-height: 200px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="esquerdo">
        <a href="index.html">🏠 Inicio</a>
        <a href="biblioteca/biblioteca.html">📚 Biblioteca</a>
        <a href="laboratorio/laboratorio.html">🧪 Laboratorio</a>
        <a href="area-de-projetos.html">📂 Projetos</a>
        <a href="andromeda-inteligente.html">🧠 Andromeda</a>
    </div>

    <div class="direito">
        <a href="constituicao.html">⚖️ Constituicao</a>
        <a href="manifesto.html">📜 Manifesto</a>
        <a href="#">🎯 Missoes</a>
        <a href="#">🧠 Memoria</a>
    </div>

    <div class="caixa-chave" id="caixaChave">
        <h2>🔑 COLE SUA CHAVE DO GEMINI</h2>
        <input type="text" id="chaveApi" placeholder="Começa com AlzaSy...">
        <button class="botao-ligar" onclick="ligarAndromeda()">✅ LIGAR A ANDRÔMEDA</button>
        <p style="font-size:13px; color:#94a3b8; margin-top:10px;">A chave fica salva. Só faz isso uma vez.</p>
    </div>

    <div class="resposta" id="resposta" style="display:none;"></div>

    <div class="area-conversa">
        <input type="text" class="caixa-texto" id="mensagem" placeholder="Escreva ou fale aqui..." onkeypress="if(event.key==='Enter')enviarMensagem()">
        <button class="botao-microfone" id="botaoMic" onclick="iniciarFala()">🎤</button>
    </div>

<script>
let chave = localStorage.getItem('chaveGemini') || '';
let reconhecimento = null;

if(chave) document.getElementById('caixaChave').style.display = 'none';

function ligarAndromeda(){
    chave = document.getElementById('chaveApi').value.trim();
    if(!chave){ alert('Cola a chave primeiro!'); return; }
    localStorage.setItem('chaveGemini', chave);
    document.getElementById('caixaChave').style.display = 'none';
    alert('✅ Andrômeda ligada!');
}

async function enviarMensagem(){
    const texto = document.getElementById('mensagem').value.trim();
    if(!texto) return;
    if(!chave) { alert('Cole a chave e ligue primeiro!'); return; }
    
    document.getElementById('mensagem').value = '';
    const respostaDiv = document.getElementById('resposta');
    respostaDiv.style.display = 'block';
    respostaDiv.innerText = '🧠 Pensando...';

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${chave}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{ parts: [{ text: texto }] }]
            })
        });

        if(!res.ok) throw new Error('Erro na conexão');
        
        const dados = await res.json();
        const textoResposta = dados?.candidates?.[0]?.content?.parts?.[0]?.text || 'Desculpe, não consegui entender.';
        
        respostaDiv.innerText = textoResposta;
        falaResposta(textoResposta);

    } catch(erro) {
        respostaDiv.innerText = '⚠️ Erro: verifique a chave ou a internet.';
    }
}

function falaResposta(texto){
    if(!('speechSynthesis' in window)) return;
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = 'pt-BR';
    fala.rate = 1.0;
    fala.pitch = 1.0;
    speechSynthesis.speak(fala);
}

function iniciarFala(){
    const botao = document.getElementById('botaoMic');
    
    if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
        alert('Seu navegador não suporta reconhecimento de voz.');
        return;
    }

    const Recon = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!reconhecimento) reconhecimento = new Recon();
    
    reconhecimento.lang = 'pt-BR';
    reconhecimento.continuous = false;
    reconhecimento.onresult = (evento) => {
        const falado = evento.results[0][0].transcript;
        document.getElementById('mensagem').value = falado;
        botao.classList.remove('gravando');
        enviarMensagem();
    };
    reconhecimento.onend = () => botao.classList.remove('gravando');
    reconhecimento.onerror = () => botao.classList.remove('gravando');
    
    botao.classList.add('gravando');
    reconhecimento.start();
}
</script>

</body>
</html>
