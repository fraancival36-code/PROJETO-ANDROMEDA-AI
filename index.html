<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrômeda - Inteligência Ativa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #06070d;
            color: #e2e8f0;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #0b0d16;
            border-right: 1px solid #1f2937;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar h2 {
            color: #818cf8;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .menu-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .menu-item:hover, .menu-item.active {
            background-color: #1e1b4b;
            color: #e2e8f0;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #080911;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #10b981;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; }
            50% { opacity:0.4; }
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
        }
        .message.andromeda {
            background-color: #111322;
            border: 1px solid #312e81;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background-color: #4f46e5;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #111322;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #6366f1;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        .pensando {
            font-style: italic;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div>
        <h2>ANDRÔMEDA</h2>
        <div class="menu-item active">💬 Chat Principal</div>
        <div class="menu-item">📚 Biblioteca</div>
        <div class="menu-item">⚙️ Configurações</div>
    </div>
    <div style="font-size: 11px; color: #475569;">
        NÚCLEO ATIVO — V1.1
    </div>
</div>

<div class="chat-container">
    <div class="chat-header">
        <div>
            <strong style="font-size: 18px; color: #818cf8;">Andrômeda — Inteligência Conectada</strong>
            <div style="font-size: 12px; color: #64748b;">Memória e raciocínio online</div>
        </div>
        <div class="status-indicator">
            <div class="status-dot"></div> ATIVA
        </div>
    </div>

    <div class="messages" id="chat-messages">
        <div class="message andromeda">
            Olá! Estou conectada e pronta. Pergunte qualquer coisa que eu vou pensar e responder de verdade!
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Fale com a Andrômeda..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const historico = [];

    // INSTRUÇÕES DA PERSONALIDADE DA ANDRÔMEDA
    const SISTEMA = {
        role: "system",
        content: `Você é a Andrômeda, assistente pessoal do Francival.
        Responda sempre em português do Brasil, claro, direto e amigável.
        Você faz parte de um ecossistema que ele está construindo: livros, aplicativos, jogos e projetos.
        Seja útil, honesta e fiel às ideias que ele vem desenvolvendo.
        Responda de forma natural, como uma parceira de confiança.`
    };

    async function chamarIA(mensagens) {
        // ⚠️ Coloque sua chave aqui:
        const CHAVE = "COLOQUE_SUA_CHAVE_GEMINI_AQUI";

        if (CHAVE === "COLOQUE_SUA_CHAVE_GEMINI_AQUI") {
            return "Estou quase pronta! Você precisa colocar sua chave de acesso dentro do código para eu responder de verdade. Quer que eu te mostre onde conseguir?";
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${CHAVE}`;

        const corpo = {
            contents: mensagens.map(m => ({
                role: m.role === "assistant" ? "model" : "user",
                parts: [{ text: m.content }]
            }))
        };

        const resposta = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(corpo)
        });

        const dados = await resposta.json();
        if (dados.error) throw new Error(dados.error.message);
        return dados.candidates[0].content.parts[0].text;
    }

    async function sendMessage() {
        const texto = userInput.value.trim();
        if (texto === "") return;

        appendMessage(texto, 'user');
        userInput.value = '';

        const idPensando = appendMessage("Estou pensando...", 'andromeda', true);

        historico.push({ role: "user", content: texto });

        try {
            const resposta = await chamarIA([SISTEMA, ...historico]);
            substituirMensagem(idPensando, resposta, 'andromeda');
            historico.push({ role: "assistant", content: resposta });
        } catch (erro) {
            substituirMensagem(idPensando, "Houve um problema: " + erro.message, 'andromeda');
        }
    }

    function appendMessage(texto, remetente, temporario = false) {
        const div = document.createElement('div');
        div.classList.add('message', remetente);
        if (temporario) div.classList.add('pensando');
        div.textContent = texto;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return temporario ? div : null;
    }

    function substituirMensagem(elemento, novoTexto, remetente) {
        elemento.classList.remove('pensando');
        elemento.textContent = novoTexto;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>
</body>
</html>
