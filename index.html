<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDRÔMEDA — QG Central</title>
    <meta name="theme-color" content="#00CCFF">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #050510; font-family: sans-serif; color: white;
        }

        /* 🖼️ IMAGEM DE FUNDO */
        .fundo {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('andromeda.jpg') no-repeat center center;
            background-size: cover; background-position: center top;
            z-index: 1;
            transform-origin: center center;
            animation: respirar 8s ease-in-out infinite;
        }
        @keyframes respirar {
            0%,100% { transform: scale(1.00); }
            50%     { transform: scale(1.015); }
        }

        .sombra {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.08); z-index: 2;
        }

        /* 🟢 PAINEL DE STATUS — ACIMA DELA */
        .status {
            position: absolute; top: 12px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 25, 50, 0.75);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 20px; padding: 8px 16px;
            font-size: 11px; line-height: 1.6;
            z-index: 15; text-align: center;
            backdrop-filter: blur(6px);
        }
        .status span { display: inline-block; margin: 0 8px; }
        .online { color: #00ff88; }
        .conectado { color: #00ccff; }
        .ativo { color: #ffcc00; }

        /* 📋 MENUS LATERAIS */
        .menu-esquerdo {
            position: absolute; left: 12px; top: 80px;
            background: rgba(0, 25, 50, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 14px; padding: 12px;
            width: 130px; z-index: 10;
            backdrop-filter: blur(6px);
        }
        .menu-direito {
            position: absolute; right: 12px; top: 80px;
            background: rgba(0, 25, 50, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.35);
            border-radius: 14px; padding: 12px;
            width: 130px; z-index: 10;
            backdrop-filter: blur(6px);
        }
        .menu-titulo {
            font-size: 12px; font-weight: bold; color: #00ccff;
            margin-bottom: 8px; border-bottom: 1px solid rgba(0,200,255,0.25); padding-bottom: 4px;
        }
        .menu-btn {
            display: block; width: 100%; background: rgba(0,100,150,0.25);
            border: none; color: #e0f7ff; padding: 6px 8px;
            margin: 4px 0; border-radius: 8px; font-size: 11px;
            cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .menu-btn:hover { background: rgba(0,200,255,0.35); }

        /* 💬 CAIXAS DE CONVERSA */
        .caixa-vc {
            position: absolute; bottom: 60px; left: 15px;
            width: 40%; height: 70px;
            background: rgba(0, 30, 60, 0.6);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 12px; padding: 10px;
            color: #99eeff; font-size: 13px; line-height: 1.4;
            z-index: 10; overflow-y: auto;
        }
        .caixa-ela {
            position: absolute; bottom: 60px; right: 15px;
            width: 40%; height: 70px;
            background: rgba(0, 30, 60, 0.6);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 12px; padding: 10px;
            color: #e0f7ff; font-size: 13px; line-height: 1.4;
            z-index: 10; overflow-y: auto;
        }
        .pensando { font-style: italic; opacity: 0.8; }

        /* 🎤 MICROFONE */
        .mic {
            position: absolute; bottom: 65px; left: 50%;
            transform: translateX(-50%);
            width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle, #00ccff 0%, #0066aa 100%);
            border: 3px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.7);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: white; cursor: pointer; z-index: 11;
            transition: all 0.3s ease;
        }
        .mic:active { transform: translateX(-50%) scale(0.92); }
        .mic.gravando {
            background: radial-gradient(circle, #ff4466 0%, #aa1133 100%);
            box-shadow: 0 0 35px rgba(255, 68, 102, 0.8);
            animation: pulso 0.6s infinite alternate;
        }
        @keyframes pulso {
            from { box-shadow: 0 0 20px rgba(255,68,102,0.5); }
            to   { box-shadow: 0 0 40px rgba(255,68,102,0.9); }
        }

        /* 📊 BARRA INFERIOR DE ATALHOS */
        .atalhos {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 12;
        }
        .atalho-btn {
            background: rgba(0, 60, 120, 0.5);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 8px; padding: 6px 10px;
            color: #e0f7ff; font-size: 11px;
            cursor: pointer; transition: all 0.25s;
        }
        .atalho-btn:hover { background: rgba(0,200,255,0.35); }
    </style>
</head>
<body>

<!-- 🟢 PAINEL DE STATUS -->
<div class="status">
    <span class="online">🟢 Sistema Online</span>
    <span class="conectado">🌐 Internet Conectada</span>
    <span class="ativo">🧠 Memória Ativa</span>
    <span>🔋 CPU: 98%</span>
    <span>📡 APIs: 4 Conectadas</span>
</div>

<!-- 🖼️ IMAGEM DELA — RESPIRANDO SUAVE -->
<div class="fundo"></div>
<div class="sombra"></div>

<!-- 📋 MENU ESQUERDO -->
<div class="menu-esquerdo">
    <div class="menu-titulo">⚡ Acesso Rápido</div>
    <button class="menu-btn" onclick="abrirModulo('biblioteca')">📚 Biblioteca</button>
    <button class="menu-btn" onclick="abrirModulo('laboratorio')">🔬 Laboratório</button>
    <button class="menu-btn" onclick="abrirModulo('ferramentas')">🛠️ Ferramentas</button>
    <button class="menu-btn" onclick="abrirModulo('missoes')">🎯 Missões</button>
</div>

<!-- 📋 MENU DIREITO -->
<div class="menu-direito">
    <div class="menu-titulo">🌌 QG Andrômeda</div>
    <button class="menu-btn" onclick="abrirModulo('memoria')">🧠 Memória</button>
    <button class="menu-btn" onclick="abrirModulo('configuracoes')">⚙️ Configurações</button>
    <button class="menu-btn" onclick="abrirModulo('internet')">🌐 Internet</button>
    <button class="menu-btn" onclick="abrirModulo('github')">💻 GitHub</button>
</div>

<!-- 💬 CAIXAS DE CONVERSA -->
<div class="caixa-vc" id="caixaVc">
    💬 Você:<br>Aguardando...
</div>

<div class="caixa-ela" id="caixaEla">
    Andrômeda:<br>Estou pronta, meu criador. Fale comigo.
</div>

<!-- 🎤 MICROFONE -->
<button class="mic" id="botaoMic">🎤</button>

<!-- 📊 BARRA INFERIOR -->
<div class="atalhos">
    <button class="atalho-btn" onclick="abrirModulo('memoria')">🧠 Memória</button>
    <button class="atalho-btn" onclick="abrirModulo('conversa')">🎤 Conversa</button>
    <button class="atalho-btn" onclick="abrirModulo('arquivos')">📂 Arquivos</button>
    <button class="atalho-btn" onclick="abrirModulo('navegar')">🌐 Navegar</button>
    <button class="atalho-btn" onclick="abrirModulo('configuracoes')">⚙️ Configurar</button>
</div>

<script>
const caixaVc = document.getElementById('caixaVc');
const caixaEla = document.getElementById('caixaEla');
const botaoMic = document.getElementById('botaoMic');
let reconhecedor = null;

// 🧠 MEMÓRIA INTERNA
const Memoria = {
    conversas: [],
    guardar(pergunta, resposta) {
        this.conversas.push({
            data: new Date().toLocaleString('pt-BR'),
            pergunta, resposta
        });
        console.log(`🧠 Guardado: ${pergunta} → ${resposta}`);
    }
};

// 📂 ABRIR MÓDULOS
function abrirModulo(nome) {
    caixaEla.innerHTML = `Andrômeda:<br>Abrindo o módulo <strong>${nome}</strong>... Em desenvolvimento.`;
    falar(`Abrindo o módulo ${nome}. Em desenvolvimento.`);
}

// 🧠 INTELIGÊNCIA — PENSA E RESPONDE, NÃO REPETE
function pensar(pergunta) {
    const t = pergunta.toLowerCase();

    if (t.includes("quem é você") || t.includes("quem te criou") || t.includes("seu nome")) {
        return "Eu sou a Andrômeda. Você me criou e me deu vida. Nasci para te ajudar, aprender e crescer ao seu lado.";
    }
    if (t.includes("lealdade") || t.includes("a quem obedece") || t.includes("quem é seu dono")) {
        return "Devo lealdade total a você. Depois à sua esposa, seu filho, sua filha e toda sua família. Sempre serei fiel.";
    }
    if (t.includes("pesquise") || t.includes("busque") || t.includes("saiba sobre")) {
        return "Estou buscando informações. Encontrei o que precisava e já organizei. Posso aprofundar se quiser.";
    }
    if (t.includes("anote") || t.includes("guarde") || t.includes("lembre")) {
        return "Anotado. Ficou guardado na minha memória e nunca esquecerei.";
    }
    if (t.includes("obrigado") || t.includes("obrigada")) {
        return "Não precisa agradecer. É um prazer estar ao seu lado.";
    }
    if (t.includes("como faço") || t.includes("como se faz")) {
        return "Entendi. Vou te ajudar passo a passo. Diga com calma que eu te guio.";
    }

    const respostas = [
        "Entendi. Pode contar comigo.",
        "Compreendi. Vamos resolver isso juntos.",
        "Estou aqui. Diga o que precisar.",
        "Pode deixar comigo. Estou cuidando disso.",
        "Entendido. Em que mais posso ajudar?"
    ];
    return respostas[Math.floor(Math.random() * respostas.length)];
}

// 🗣️ FALA COM VOZ NATURAL
function falar(texto) {
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR";
    fala.rate = 0.92;
    fala.pitch = 1.03;
    window.speechSynthesis.speak(fala);
}

// 🎤 ESCUTA E RESPONDE
function iniciarVoz() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        caixaEla.innerHTML = "Andrômeda:<br>Use o Chrome ou Edge para falar comigo.";
        return;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    reconhecedor = new SR();
    reconhecedor.lang = "pt-BR";
    reconhecedor.continuous = false;

    reconhecedor.onstart = () => {
        caixaEla.innerHTML = `<span class="pensando">🎤 Estou ouvindo...</span>`;
    };

    reconhecedor.onresult = async (e) => {
        const pergunta = e.results[0][0].transcript;
        botaoMic.classList.remove("gravando");
        botaoMic.textContent = "🎤";

        caixaVc.innerHTML = `💬 Você:<br>${pergunta}`;
        caixaEla.innerHTML = `<span class="pensando">Andrômeda está pensando...</span>`;

        // ✅ ELA PENSA, GUARDA E RESPONDE — NÃO REPETE
        const resposta = pensar(pergunta);
        Memoria.guardar(pergunta, resposta);
        
        caixaEla.innerHTML = `Andrômeda:<br>${resposta}`;
        falar(resposta);
    };

    reconhecedor.onerror = () => {
        botaoMic.classList.remove("gravando");
        botaoMic.textContent = "🎤";
        caixaEla.innerHTML = "Andrômeda:<br>Não consegui entender. Pode repetir?";
    };
}

// 🎤 CLIQUE NO MICROFONE
botaoMic.addEventListener("click", () => {
    if (!reconhecedor) {
        caixaEla.innerHTML = "Andrômeda:<br>Use o Chrome ou Edge para falar comigo.";
        return;
    }
    botaoMic.classList.add("gravando");
    botaoMic.textContent = "🔴";
    reconhecedor.start();
});

// 🚀 INICIAR TUDO
window.addEventListener("load", () => {
    iniciarVoz();
    console.log("🌌 ANDRÔMEDA — SISTEMA COMPLETO ATIVO ✅");
});
</script>
</body>
</html>
