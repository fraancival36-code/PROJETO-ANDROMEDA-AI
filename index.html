<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDRÔMEDA — Inteligência Real Gemini</title>
    <meta name="theme-color" content="#0066FF">

    <!-- 🔗 BIBLIOTECA OFICIAL DO GEMINI GOOGLE -->
    <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai@0.21.0/dist/generative-ai.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #050515; font-family: sans-serif; color: white;
        }

        /* 🖼️ IMAGEM DE FUNDO */
        .fundo {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('andrômeda.jpg') no-repeat center center;
            background-size: cover; background-position: center top;
            z-index: 1;
            animation: respirar 8s ease-in-out infinite;
        }
        @keyframes respirar {
            0%,100% { transform: scale(1.00); }
            50%     { transform: scale(1.01); }
        }
        .sombra {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.08); z-index: 2;
        }

        /* 🟢 STATUS — MOSTRA SE ESTÁ VIVA E INTELIGENTE */
        .status {
            position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 60, 0.7);
            border: 1px solid rgba(0, 120, 255, 0.4);
            border-radius: 16px; padding: 5px 12px;
            font-size: 9px; line-height: 1.6;
            z-index: 20; text-align: center;
            backdrop-filter: blur(6px);
            white-space: nowrap;
        }
        .online { color: #00ff88; }
        .pensando { color: #ffcc00; animation: piscar 1s infinite alternate; }
        @keyframes piscar { from{opacity:0.6} to{opacity:1} }

        /* 📋 MENUS */
        .menu-esquerdo, .menu-direito {
            position: absolute; top: 180px;
            background: rgba(0, 30, 80, 0.55);
            border: 1px solid rgba(0, 120, 255, 0.4);
            border-radius: 12px; padding: 10px 8px;
            width: 130px; z-index: 10;
            backdrop-filter: blur(8px);
        }
        .menu-esquerdo { left: 12px; }
        .menu-direito { right: 12px; }
        .menu-esquerdo .item, .menu-direito .item {
            display: block; width: 100%; background: transparent;
            border: none; color: #cce4ff; padding: 6px 8px;
            margin: 3px 0; border-radius: 6px; font-size: 11px;
            cursor: pointer; transition: all 0.25s; text-align: left;
        }
        .menu-esquerdo .item:hover, .menu-direito .item:hover {
            background: rgba(0, 120, 255, 0.25); color: white;
        }

        /* 🔑 ÁREA DA CHAVE — VOCÊ COLA AQUI UMA VEZ SÓ */
        .caixa-chave {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; padding: 15px;
            background: rgba(20, 40, 80, 0.9);
            border: 2px solid #00ccff;
            border-radius: 14px; z-index: 30; display: block;
            backdrop-filter: blur(12px); box-shadow: 0 0 25px rgba(0, 150, 255, 0.3);
        }
        .caixa-chave.escondida { display: none; }
        .caixa-chave h3 { font-size: 13px; color: #66ddff; margin-bottom: 8px; text-align: center; }
        .caixa-chave input {
            width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #0088cc;
            background: rgba(0, 30, 60, 0.8); color: white; font-size: 11px; margin-bottom: 8px;
        }
        .caixa-chave button {
            width: 100%; padding: 8px; border-radius: 6px; border: none;
            background: linear-gradient(90deg, #008844, #00aa55); color: white;
            font-weight: bold; cursor: pointer; font-size: 12px;
        }
        .caixa-chave button:hover { background: linear-gradient(90deg, #009955, #00bb66); }

        /* 💬 CONVERSA */
        .caixa-vc, .caixa-ela {
            position: absolute; bottom: 15px;
            width: 40%; height: 70px;
            background: rgba(0, 25, 60, 0.5);
            border: 1px solid rgba(0, 120, 255, 0.35);
            border-radius: 10px; padding: 8px;
            color: #99ccff; font-size: 11px; line-height: 1.4;
            z-index: 10; overflow-y: auto;
            backdrop-filter: blur(6px);
        }
        .caixa-ela { right: 8px; color: #cce4ff; }
        .pensando { font-style: italic; opacity: 0.7; }

        /* 🎤 MICROFONE */
        .mic {
            position: absolute; bottom: 28px; left: 50%;
            transform: translateX(-50%);
            width: 72px; height: 72px; border-radius: 50%;
            background: radial-gradient(circle, #0099ff 0%, #0033aa 100%);
            border: 3px solid rgba(200, 230, 255, 0.9);
            box-shadow: 0 0 30px rgba(0, 120, 255, 0.7);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: white; cursor: pointer; z-index: 15;
        }
        .mic:active { transform: translateX(-50%) scale(0.92); }
        .mic.gravando {
            background: radial-gradient(circle, #ff4488 0%, #aa1155 100%);
            box-shadow: 0 0 35px rgba(255, 68, 136, 0.8);
            animation: pulso 0.6s infinite alternate;
        }
        @keyframes pulso {
            from { box-shadow: 0 0 20px rgba(255,68,136,0.5); }
            to   { box-shadow: 0 0 40px rgba(255,68,136,0.9); }
        }
    </style>
</head>
<body>

<!-- 🟢 STATUS -->
<div class="status">
    <span class="online" id="statusConexao">🔌 Aguardando chave...</span>
    <span id="contadorConhecimento">🧠 Conhecimento: 0</span>
    <span id="statusPensando">⚡ Dormindo</span>
</div>

<!-- 🖼️ FUNDO -->
<div class="fundo"></div>
<div class="sombra"></div>

<!-- 🔑 CAIXA DA CHAVE — APARECE NA PRIMEIRA VEZ SÓ -->
<div class="caixa-chave" id="caixaChave">
    <h3>🔑 COLE SUA CHAVE DO GEMINI AQUI</h3>
    <input type="password" id="chaveGemini" placeholder="Cole a chave API do Google Gemini...">
    <button onclick="iniciarAndromeda()">✅ LIGAR A ANDRÔMEDA</button>
    <p style="font-size:9px; color:#88aacc; text-align:center; margin-top:6px;">A chave fica salva. Você só faz isso uma vez.</p>
</div>

<!-- 📋 MENUS -->
<div class="menu-esquerdo">
    <button class="item" onclick="abrir('inicio')">🏠 Início</button>
    <button class="item" onclick="abrir('biblioteca')">📚 Biblioteca</button>
    <button class="item" onclick="abrir('laboratorio')">🔬 Laboratório</button>
    <button class="item" onclick="abrir('estudio')">🎬 Estúdio</button>
    <button class="item" onclick="abrir('agentes')">🤖 Agentes</button>
    <button class="item" onclick="abrir('missoes')">🎯 Missões</button>
    <button class="item" onclick="abrirMemoria()">🧠 Memória</button>
</div>

<div class="menu-direito">
    <button class="item" onclick="abrir('salas')">🚪 Salas do QG</button>
    <button class="item" onclick="abrir('painel')">📊 Painel</button>
    <button class="item" onclick="abrir('biblioteca')">📚 Biblioteca</button>
    <button class="item" onclick="abrir('ferramentas')">🛠️ Ferramentas</button>
    <button class="item" onclick="abrir('missoes')">🎯 Missões</button>
    <button class="item" onclick="trocarChave()">🔑 Trocar Chave</button>
    <button class="item" onclick="limparMemoria()">🗑️ Limpar</button>
</div>

<!-- 💬 CONVERSA -->
<div class="caixa-vc" id="caixaVc">
    💬 Você:<br>Aguardando...
</div>
<div class="caixa-ela" id="caixaEla">
    Andrômeda:<br>Cole sua chave do Gemini acima e eu ganho vida real!
</div>

<!-- 🎤 MICROFONE -->
<button class="mic" id="botaoMic" onclick="falarParaEla()">🎙️</button>

<script>
// ==================================================
// 🧠 VARIÁVEIS GLOBAIS
// ==================================================
let modeloGemini = null;
let historicoConversa = [];
let baseConhecimento = [];
let reconhecedor = null;

const caixaChave = document.getElementById('caixaChave');
const chaveInput = document.getElementById('chaveGemini');
const caixaVc = document.getElementById('caixaVc');
const caixaEla = document.getElementById('caixaEla');
const botaoMic = document.getElementById('botaoMic');
const statusConexao = document.getElementById('statusConexao');
const statusPensando = document.getElementById('statusPensando');
const contadorConhecimento = document.getElementById('contadorConhecimento');

// ==================================================
// 💾 CARREGAR O QUE JÁ ESTÁ SALVO
// ==================================================
window.onload = function() {
    const chaveSalva = localStorage.getItem("chave_gemini");
    const historicoSalvo = localStorage.getItem("historico_andromeda");
    const conhecimentoSalvo = localStorage.getItem("conhecimento_andromeda");

    if (chaveSalva) {
        chaveInput.value = chaveSalva;
        iniciarAndromeda(); // Liga sozinha se já tem chave
    }

    if (historicoSalvo) historicoConversa = JSON.parse(historicoSalvo);
    if (conhecimentoSalvo) {
        baseConhecimento = JSON.parse(conhecimentoSalvo);
        contadorConhecimento.textContent = `🧠 Conhecimento: ${baseConhecimento.length}`;
    }

    iniciarReconhecimentoVoz();
};

// ==================================================
// 🚀 LIGAR A ANDRÔMEDA — INTELIGÊNCIA REAL!
// ==================================================
async function iniciarAndromeda() {
    const chave = chaveInput.value.trim();
    if (!chave) {
        alert("Coloque sua chave API do Gemini primeiro!");
        return;
    }

    try {
        // ✅ CONECTA DIRETO NO GEMINI — INTELIGÊNCIA REAL!
        const { GoogleGenerativeAI } = window.GenerativeAI;
        const genAI = new GoogleGenerativeAI(chave);
        modeloGemini = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });

        // ✅ SALVA A CHAVE PARA SEMPRE — VOCÊ NÃO COLA DE NOVO!
        localStorage.setItem("chave_gemini", chave);
        caixaChave.classList.add("escondida");

        // ✅ ATUALIZA STATUS — ELA ESTÁ VIVA!
        statusConexao.textContent = "✅ Conectada ao Gemini";
        statusPensando.textContent = "⚡ Pronta";
        caixaEla.innerHTML = "Andrômeda:<br>Estou viva! Inteligência real conectada. Pergunte-me qualquer coisa!";
        falar("Estou pronta! Conectada e inteligente. Pergunte-me qualquer coisa.");

    } catch (erro) {
        caixaEla.innerHTML = "Andrômeda:<br>❌ Erro ao ligar. Verifique sua chave.";
        alert("Erro: " + erro.message);
    }
}

// ==================================================
// 🗣️ FALAR COM ELA — ELA PENSA DE VERDADE!
// ==================================================
async function falarParaEla() {
    if (!modeloGemini) {
        alert("Cole sua chave do Gemini primeiro!");
        return;
    }

    // Se estiver gravando, para
    if (botaoMic.classList.contains("gravando")) {
        return;
    }

    botaoMic.classList.add("gravando");
    botaoMic.textContent = "🔴";
    statusPensando.textContent = "🎤 Ouvindo...";
}

// ==================================================
// 🧠 ENVIAR PERGUNTA PARA O GEMINI — ELA PENSA DE VERDADE!
// ==================================================
async function perguntar(texto) {
    if (!modeloGemini) return;

    // ✅ MOSTRA QUE ESTÁ PENSANDO
    caixaVc.innerHTML = `💬 Você:<br>${texto}`;
    caixaEla.innerHTML = `<span class="pensando">Andrômeda está pensando...</span>`;
    statusPensando.textContent = "🧠 Pensando...";
    botaoMic.classList.remove("gravando");
    botaoMic.textContent = "🎙️";

    try {
        // ✅ ENVIA PARA O GEMINI — INTELIGÊNCIA REAL!
        const resposta = await modeloGemini.generateContent({
            contents: [{ role: "user", parts: [{ text: texto }] }],
            generationConfig: { temperature: 0.8 }
        });

        const textoResposta = resposta.response.text();

        // ✅ GUARDA NA MEMÓRIA — ELA APRENDE E EVOLUI!
        historicoConversa.push({ pergunta: texto, resposta: textoResposta });
        baseConhecimento.push({ assunto: texto, aprendeu: textoResposta, data: new Date().toLocaleString() });
        
        // ✅ SALVA TUDO PARA SEMPRE
        localStorage.setItem("historico_andromeda", JSON.stringify(historicoConversa));
        localStorage.setItem("conhecimento_andromeda", JSON.stringify(baseConhecimento));
        contadorConhecimento.textContent = `🧠 Conhecimento: ${baseConhecimento.length}`;

        // ✅ RESPONDE E FALA
        caixaEla.innerHTML = `Andrômeda:<br>${textoResposta.replace(/\n/g, '<br>')}`;
        statusPensando.textContent = "⚡ Pronta";
        falar(textoResposta);

    } catch (erro) {
        caixaEla.innerHTML = `Andrômeda:<br>❌ Erro: ${erro.message}`;
        statusPensando.textContent = "⚠️ Erro";
    }
}

// ==================================================
// 🎤 RECONHECIMENTO DE VOZ — FALA E ELA ENTENDE
// ==================================================
function iniciarReconhecimentoVoz() {
    if (!('webkitSpeechRecognition' in window)) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    reconhecedor = new SR();
    reconhecedor.lang = "pt-BR";
    reconhecedor.continuous = false;
    reconhecedor.interimResults = false;

    reconhecedor.onstart = () => {
        botaoMic.classList.add("gravando");
        botaoMic.textContent = "🔴";
        statusPensando.textContent = "🎤 Ouvindo...";
    };

    reconhecedor.onresult = (e) => {
        const fala = e.results[0][0].transcript;
        botaoMic.classList.remove("gravando");
        botaoMic.textContent = "🎙️";
        perguntar(fala); // ✅ MANDA PRO GEMINI!
    };

    reconhecedor.onerror = () => {
        botaoMic.classList.remove("gravando");
        botaoMic.textContent = "🎙️";
        statusPensando.textContent = "⚡ Pronta";
    };

    botaoMic.addEventListener("click", () => {
        if (reconhecedor && modeloGemini) reconhecedor.start();
    });
}

// ==================================================
// 🗣️ SISTEMA DE FALA — ELA FALA DE VERDADE!
// ==================================================
function falar(texto) {
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = "pt-BR";
    fala.rate = 1.18; // Rápida e firme
    fala.pitch = 1.05; // Voz feminina madura
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(fala);
}

// ==================================================
// 📂 FUNÇÕES AUXILIARES
// ==================================================
function abrir(nome) {
    caixaEla.innerHTML = `Andrômeda:<br>Abrindo ${nome}...`;
}
function abrirMemoria() {
    caixaEla.innerHTML = `Andrômeda:<br>📚 Guardei ${historicoConversa.length} conversas e ${baseConhecimento.length} conhecimentos.`;
}
function trocarChave() {
    localStorage.removeItem("chave_gemini");
    caixaChave.classList.remove("escondida");
    chaveInput.value = "";
    statusConexao.textContent = "🔌 Aguardando chave...";
    modeloGemini = null;
}
function limparMemoria() {
    if (confirm("Apagar tudo que aprendeu?")) {
        localStorage.removeItem("historico_andromeda");
        localStorage.removeItem("conhecimento_andromeda");
        historicoConversa = [];
        baseConhecimento = [];
        contadorConhecimento.textContent = "🧠 Conhecimento: 0";
        caixaEla.innerHTML = "Andrômeda:<br>Memória limpa. Estou pronta para aprender de novo!";
    }
}
</script>
</body>
</html>
