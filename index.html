<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="FRANCIVAL ALVES FARIAS" />
  <title>ANDRÔMEDA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #0a0a0f; color: #f0f0f0; min-height: 100vh; }

    /* 🔐 TELA DE ACESSO */
    .tela-chave {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .tela-chave.escondida { display: none; }
    .titulo-andromeda { font-size: 36px; margin-bottom: 8px; color: #4ea0d1; letter-spacing: 4px; }
    .subtitulo { font-size: 14px; color: #888; margin-bottom: 40px; }
    .caixa-chave { background: #151520; padding: 30px; border-radius: 12px; width: 100%; max-width: 340px; }
    .input-chave {
      width: 100%; padding: 14px; font-size: 18px; text-align: center;
      background: #000; border: 1px solid #333; color: #fff; border-radius: 8px;
      margin-bottom: 15px; outline: none;
    }
    .btn-entrar {
      width: 100%; padding: 14px; font-size: 16px; background: #2563eb;
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
    }
    .erro { color: #ff5555; text-align: center; margin-top: 10px; display: none; }

    /* 🧭 CABEÇALHO DA ANDRÔMEDA */
    .cabecalho {
      position: fixed; top: 0; left: 0; right: 0; background: #111; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #333; z-index: 100;
    }
    .nome-assistente { font-size: 18px; font-weight: bold; color: #4ea0d1; }
    .btn-voltar { background: none; border: 1px solid #4ea0d1; color: #4ea0d1; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

    /* 💬 ÁREA DE CONVERSA — TEXTO */
    .area-chat { padding: 70px 16px 100px; display: none; max-width: 700px; margin: 0 auto; }
    .area-chat.ativo { display: block; }
    .mensagem { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; }
    .mensagem.assistente { background: #1a1a2e; margin-right: auto; border-bottom-left-radius: 4px; }
    .mensagem.usuario { background: #2563eb; margin-left: auto; border-bottom-right-radius: 4px; }
    .saudacao-inicial { color: #ccc; font-size: 14px; margin-bottom: 20px; }

    /* 🎤 ÁREA DE ENTRADA — TEXTO + VOZ */
    .entrada {
      position: fixed; bottom: 0; left: 0; right: 0; background: #111; padding: 12px 16px;
      display: flex; gap: 10px; align-items: center; border-top: 1px solid #333;
    }
    .input-texto {
      flex: 1; padding: 12px 16px; background: #1a1a2e; border: 1px solid #333;
      color: #fff; border-radius: 24px; outline: none; font-size: 15px;
    }
    .btn-voz {
      width: 44px; height: 44px; border-radius: 50%; background: #2563eb;
      border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-voz.gravando { background: #dc2626; animation: pulso 1s infinite; }
    @keyframes pulso { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .btn-enviar {
      padding: 10px 18px; background: #2563eb; border: none; color: #fff;
      border-radius: 20px; cursor: pointer; font-size: 14px;
    }

    /* 🚑 BOTÃO PRIME */
    .btn-prime {
      margin-top: 20px; padding: 14px 20px; background: linear-gradient(135deg, #dc2626, #f97316);
      border: none; color: #fff; border-radius: 10px; cursor: pointer; font-size: 16px;
      width: 100%; font-weight: bold;
    }

    /* 📱 ÁREA DO PRIME */
    .area-prime { display: none; padding-top: 60px; }
    .area-prime.ativo { display: block; background: #000; min-height: 100vh; }
  </style>
</head>
<body>

  <!-- 🔐 TELA DE ENTRADA -->
  <div class="tela-chave" id="telaChave">
    <h1 class="titulo-andromeda">ANDRÔMEDA</h1>
    <p class="subtitulo">Assistente · Voz e Texto</p>
    <div class="caixa-chave">
      <input type="text" id="chaveInput" class="input-chave" placeholder="Chave de acesso" maxlength="20">
      <button class="btn-entrar" id="btnEntrar">ENTRAR</button>
      <div class="erro" id="msgErro">Chave inválida</div>
    </div>
  </div>

  <!-- 🧭 CABEÇALHO (depois de entrar) -->
  <div class="cabecalho" id="cabecalho" style="display:none;">
    <button class="btn-voltar" id="btnVoltar">← Sair</button>
    <span class="nome-assistente">ANDRÔMEDA</span>
    <span style="width:60px;"></span>
  </div>

  <!-- 💬 ÁREA DE CONVERSA -->
  <div class="area-chat" id="areaChat">
    <p class="saudacao-inicial">Estou aqui. Fale comigo por texto ou voz. 🎤</p>
    <div id="caixaMensagens"></div>
    <button class="btn-prime" id="btnAbrirPrime">🚑 ABRIR PRIME — PRIMEIROS SOCORROS</button>
  </div>

  <!-- 🎤 ÁREA DE ENTRADA -->
  <div class="entrada" id="entrada" style="display:none;">
    <input type="text" id="inputTexto" class="input-texto" placeholder="Digite sua mensagem...">
    <button class="btn-voz" id="btnVoz">🎤</button>
    <button class="btn-enviar" id="btnEnviar">Enviar</button>
  </div>

  <!-- 🚑 ÁREA DO PRIME -->
  <div class="area-prime" id="areaPrime">
    <div id="root"></div>
  </div>

  <script>
    // 🔑 CHAVE DE ACESSO
    const CHAVE_CORRETA = "ANDROMEDA2026";

    // Elementos
    const telaChave = document.getElementById('telaChave');
    const chaveInput = document.getElementById('chaveInput');
    const btnEntrar = document.getElementById('btnEntrar');
    const msgErro = document.getElementById('msgErro');
    const cabecalho = document.getElementById('cabecalho');
    const areaChat = document.getElementById('areaChat');
    const entrada = document.getElementById('entrada');
    const areaPrime = document.getElementById('areaPrime');
    const btnVoltar = document.getElementById('btnVoltar');
    const btnAbrirPrime = document.getElementById('btnAbrirPrime');
    const inputTexto = document.getElementById('inputTexto');
    const btnEnviar = document.getElementById('btnEnviar');
    const btnVoz = document.getElementById('btnVoz');
    const caixaMensagens = document.getElementById('caixaMensagens');

    let reconhecimentoVoz = null;
    let gravando = false;

    // ✅ Entrar com chave
    function entrar() {
      if (chaveInput.value.trim().toUpperCase() === CHAVE_CORRETA) {
        telaChave.classList.add('escondida');
        cabecalho.style.display = 'flex';
        areaChat.classList.add('ativo');
        entrada.style.display = 'flex';
        msgErro.style.display = 'none';
        chaveInput.value = '';
      } else {
        msgErro.style.display = 'block';
        chaveInput.value = '';
      }
    }

    btnEntrar.addEventListener('click', entrar);
    chaveInput.addEventListener('keydown', e => e.key === 'Enter' && entrar());

    // 📤 Enviar mensagem de texto
    function enviarMensagem() {
      const texto = inputTexto.value.trim();
      if (!texto) return;
      
      // Adiciona mensagem do usuário
      addMensagem(texto, 'usuario');
      inputTexto.value = '';
      
      // Resposta da Andrômeda
      setTimeout(() => {
        addMensagem('Recebido. Estou processando sua mensagem. Em desenvolvimento — em breve responderei com inteligência completa.', 'assistente');
      }, 600);
    }

    function addMensagem(texto, tipo) {
      const div = document.createElement('div');
      div.className = `mensagem ${tipo}`;
      div.textContent = texto;
      caixaMensagens.appendChild(div);
      caixaMensagens.scrollTop = caixaMensagens.scrollHeight;
    }

    btnEnviar.addEventListener('click', enviarMensagem);
    inputTexto.addEventListener('keydown', e => e.key === 'Enter' && enviarMensagem());

    // 🎤 Reconhecimento de Voz
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      reconhecimentoVoz = new SpeechRecognition();
      reconhecimentoVoz.lang = 'pt-BR';
      reconhecimentoVoz.continuous = false;
      reconhecimentoVoz.onresult = (e) => {
        const transcrito = e.results[0][0].transcript;
        inputTexto.value = transcrito;
        enviarMensagem();
      };
      reconhecimentoVoz.onend = () => {
        gravando = false;
        btnVoz.classList.remove('gravando');
      };
      reconhecimentoVoz.onerror = () => {
        gravando = false;
        btnVoz.classList.remove('gravando');
      };
    }

    btnVoz.addEventListener('click', () => {
      if (!reconhecimentoVoz) {
        alert('Reconhecimento de voz não disponível no navegador. Use o Chrome.');
        return;
      }
      if (gravando) {
        reconhecimentoVoz.stop();
        gravando = false;
        btnVoz.classList.remove('gravando');
      } else {
        reconhecimentoVoz.start();
        gravando = true;
        btnVoz.classList.add('gravando');
      }
    });

    // 🚑 Abrir PRIME
    btnAbrirPrime.addEventListener('click', () => {
      areaChat.classList.remove('ativo');
      entrada.style.display = 'none';
      areaPrime.classList.add('ativo');
      document.querySelector('.nome-assistente').textContent = 'PRIME — Socorros';
    });

    // 🔙 Voltar
    btnVoltar.addEventListener('click', () => {
      if (areaPrime.classList.contains('ativo')) {
        areaPrime.classList.remove('ativo');
        areaChat.classList.add('ativo');
        entrada.style.display = 'flex';
        document.querySelector('.nome-assistente').textContent = 'ANDRÔMEDA';
      } else {
        // Voltar para tela de chave
        cabecalho.style.display = 'none';
        areaChat.classList.remove('ativo');
        entrada.style.display = 'none';
        areaPrime.classList.remove('ativo');
        telaChave.classList.remove('escondida');
      }
    });
  </script>

  <!-- ⚛️ CARREGA O PRIME -->
  <script type="module" src="/src/App.jsx"></script>
</body>
</html>
