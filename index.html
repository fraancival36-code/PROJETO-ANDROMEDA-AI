<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Andrômeda — QG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #030114; color: #fff; overflow: hidden; min-height: 100vh; }
    .escondido { display: none !important; }

    /* 🔑 CAIXA DE CHAVE — APARECE PRIMEIRO */
    .camada-chave {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5,7,26,0.95); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .caixa-chave {
      background: rgba(15,23,42,0.95); border: 2px solid #00d2ff;
      border-radius: 20px; padding: 30px; max-width: 400px; width: 100%;
      box-shadow: 0 0 40px rgba(0,210,255,0.4);
    }
    .caixa-chave h2 { color: #8be4ff; text-align: center; margin-bottom: 20px; font-size: 20px; }
    .caixa-chave input {
      width: 100%; padding: 15px; font-size: 16px; border-radius: 12px;
      border: 1px solid #00d2ff; background: #05071a; color: white; margin-bottom: 15px;
    }
    .btn-salvar-chave {
      width: 100%; padding: 15px; background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer;
    }
    .dica-chave { font-size: 13px; color: #888; margin-top: 15px; text-align: center; }

    /* FUNDO CÓSMICO */
    .space-background {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1a0b36 0%, #050014 70%, #000 100%);
      z-index: 1;
    }

    .app-container {
      position: relative; z-index: 2;
      width: 100%; max-width: 500px; margin: 0 auto;
      min-height: 100vh; padding: 20px 15px 100px;
    }

    /* BARRA DE STATUS DE CIMA */
    .barra-topo {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; margin-bottom: 20px;
      border-bottom: 1px solid rgba(0,210,255,0.2);
    }
    .status-esquerdo { color: #8be4ff; font-size: 14px; }
    .status-direito { color: #88ccff; font-size: 13px; }

    /* PAINÉIS HUD — TRANSPARENTES, FLUTUANTES ✨ */
    .hud-panel {
      position: absolute; top: 100px; width: 130px;
      background: rgba(10, 20, 50, 0.35);
      border: 1px solid rgba(0, 195, 255, 0.5);
      box-shadow: 0 0 15px rgba(0, 195, 255, 0.2);
      backdrop-filter: blur(8px);
      border-radius: 10px; padding: 12px;
    }
    .left-panel { left: 5px; }
    .right-panel { right: 5px; }
    .titulo-painel { font-size: 12px; color: #00d2ff; margin-bottom: 8px; border-bottom: 1px solid rgba(0,195,255,0.2); padding-bottom: 5px; }
    .menu-item {
      font-size: 13px; padding: 8px 6px;
      border-bottom: 1px solid rgba(0,195,255,0.15);
      color: #8be4ff; cursor: pointer; border-radius: 4px;
      transition: all 0.2s;
    }
    .menu-item:hover, .menu-item.ativo {
      background: rgba(0,195,255,0.15);
    }

    /* AVATAR CENTRAL */
    .avatar-container {
      display: flex; justify-content: center; margin-top: 220px; margin-bottom: 20px;
    }
    .avatar-img {
      max-width: 280px; width: 80%; height: auto;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,210,255,0.3);
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; color: white;
    }

    /* 💬 RESPOSTA */
    .caixa-resposta {
      background: rgba(10,20,50,0.4); border: 1px solid rgba(0,195,255,0.4);
      border-radius: 12px; padding: 15px; margin: 20px 0;
      backdrop-filter: blur(8px); display: none;
      font-size: 15px; line-height: 1.7;
      color: #e0f0ff;
    }

    /* ✏️ ÁREA DE ENTRADA */
    .entrada-container {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 15px;
      background: linear-gradient(to top, rgba(5,7,26,0.95), rgba(5,7,26,0.6));
      display: flex; gap: 10px; align-items: center;
      border-top: 1px solid rgba(0,210,255,0.3);
      z-index: 50;
    }
    .entrada-container input {
      flex: 1; padding: 14px 18px; font-size: 16px;
      border-radius: 25px; border: 2px solid rgba(0,210,255,0.5);
      background: rgba(15,23,42,0.6); color: white;
      backdrop-filter: blur(8px);
    }
    .mic-button, .btn-envio {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white; font-size: 20px; cursor: pointer;
      box-shadow: 0 0 15px rgba(0,210,255,0.4);
    }
  </style>
</head>
<body>

<!-- 🔑 CAIXA DE CHAVE — APARECE PRIMEIRO -->
<div class="camada-chave" id="camadaChave">
  <div class="caixa-chave">
    <h2>🔑 Chave da Andrômeda</h2>
    <input type="text" id="entradaChave" placeholder="Cole sua chave aqui...">
    <button class="btn-salvar-chave" onclick="salvarChave()">✅ Salvar e Ativar</button>
    <p class="dica-chave">Pegue grátis em: aistudio.google.com → "Criar chave de API"</p>
  </div>
</div>

<!-- FUNDO CÓSMICO -->
<div class="space-background"></div>

<div class="app-container escondido" id="telaPrincipal">

  <!-- STATUS DE CIMA -->
  <div class="barra-topo">
    <div class="status-esquerdo">✅ Andrômeda Ativa 🧠 Memória: 31</div>
    <div class="status-direito" id="statusTexto">Pronta</div>
  </div>

  <!-- PAINEL ESQUERDO HUD -->
  <div class="hud-panel left-panel">
    <div class="menu-item">🏠 Início</div>
    <div class="menu-item">📚 Biblioteca</div>
    <div class="menu-item">🧪 Laboratório</div>
    <div class="menu-item">🎨 Estúdio</div>
    <div class="menu-item">🤖 Agentes</div>
    <div class="menu-item">🎯 Missões</div>
    <div class="menu-item">🧠 Memória</div>
  </div>

  <!-- PAINEL DIREITO HUD -->
  <div class="hud-panel right-panel">
    <div class="titulo-painel">Salas do QG</div>
    <div class="menu-item">📊 Painel</div>
    <div class="menu-item">📚 Biblioteca</div>
    <div class="menu-item">🛠️ Ferramentas</div>
    <div class="menu-item ativo">🎯 Missões</div>
    <div class="menu-item">🗑️ Limpar</div>
  </div>

  <!-- AVATAR CENTRAL -->
  <div class="avatar-container">
    <div class="avatar-img">🌌</div>
  </div>

  <!-- 💬 ÁREA DE RESPOSTA -->
  <div class="caixa-resposta" id="caixaResposta">
    <strong>🌌 Andrômeda:</strong><br><br>
    <span id="textoResposta"></span>
  </div>

  <!-- 🎤 ÁREA DE ENTRADA E MICROFONE -->
  <div class="entrada-container">
    <input type="text" id="entradaTexto" placeholder="Escreva ou fale com a Andrômeda...">
    <button class="mic-button" id="btnMic" onclick="ativarMic()">🎤</button>
    <button class="btn-envio" onclick="enviarMensagem()">➤</button>
  </div>

</div>

<script>
let CHAVE_GEMINI = localStorage.getItem('chaveGemini') || '';
const SISTEMA = `Você é a Andrômeda, assistente pessoal de Francival Alves Farias. Fale em português brasileiro, de forma calorosa, amigável e direta. Seja sempre leal e prestativa.`;

window.addEventListener('load', () => {
  if(CHAVE_GEMINI) ativarSistema();
});

function salvarChave() {
  const chave = document.getElementById('entradaChave').value.trim();
  if(!chave) return alert('Cole a chave primeiro!');
  CHAVE_GEMINI = chave;
  localStorage.setItem('chaveGemini', chave);
  ativarSistema();
}

function ativarSistema() {
  document.getElementById('camadaChave').style.display = 'none';
  document.getElementById('telaPrincipal').classList.remove('escondido');
}

async function enviarMensagem() {
  const texto = document.getElementById('entradaTexto').value.trim();
  if(!texto || !CHAVE_GEMINI) return;

  document.getElementById('entradaTexto').value = '';
  document.getElementById('caixaResposta').style.display = 'block';
  document.getElementById('textoResposta').innerText = '🧠 Pensando...';
  document.getElementById('statusTexto').innerText = 'Processando...';

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${CHAVE_GEMINI}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents: [{parts: [{text: SISTEMA + '\n\nPergunta: ' + texto}]}]})
    });
    if(!res.ok) throw new Error('Verifique a chave ou a conexão');
    const dados = await res.json();
    const resposta = dados?.candidates?.[0]?.content?.parts?.[0]?.text || 'Desculpe, não entendi.';
    
    document.getElementById('textoResposta').innerText = resposta;
    document.getElementById('statusTexto').innerText = 'Pronta';
    
    // Fala em voz
    if ('speechSynthesis' in window) {
      const fala = new SpeechSynthesisUtterance(resposta);
      fala.lang = 'pt-BR'; fala.rate = 1.05;
      speechSynthesis.cancel();
      speechSynthesis.speak(fala);
    }
  } catch(e) {
    document.getElementById('textoResposta').innerHTML = `⚠️ ${e.message}<br><br>💡 Baixe o arquivo e abra direto no Chrome! O GitHub bloqueia às vezes.`;
    document.getElementById('statusTexto').innerText = 'Erro de conexão';
  }
}

function ativarMic() {
  if(!CHAVE_GEMINI) return alert('Coloque a chave primeiro!');
  if(!('webkitSpeechRecognition' in window)) return alert('Use o Chrome para falar.');
  const rec = new webkitSpeechRecognition();
  rec.lang = 'pt-BR';
  rec.onresult = (e) => {
    document.getElementById('entradaTexto').value = e.results[0][0].transcript;
    enviarMensagem();
  };
  rec.start();
}

document.addEventListener('keypress', e => {
  if(e.key === 'Enter' && CHAVE_GEMINI) enviarMensagem();
});
</script>

</body>
</html>
