<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANDRÔMEDA — QG Central</title>
    <meta name="theme-color" content="#00CCFF">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: sans-serif;
            color: white;
        }

        /* 🖼️ IMAGEM OFICIAL DA ANDRÔMEDA — FUNDO */
        .camada-fundo {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: url('andromeda.jpg') no-repeat center center;
            background-size: cover;
            background-position: center top;
            z-index: 1;
        }

        .escurecedor {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.10);
            z-index: 2;
        }

        /* 👀 OLHOS ANIMADOS — POSICIONADOS NO ROSTO DELA */
        .olhos-animados {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 48px;
            z-index: 4;
            pointer-events: none;
        }
        .olho {
            width: 26px; height: 30px;
            background: radial-gradient(circle at 30% 30%, #fff, #aaddff);
            border-radius: 50%;
            box-shadow: 0 0 16px #00ccff, inset 0 0 8px rgba(255,255,255,0.35);
            transition: transform 0.12s ease;
        }

        /* 👄 BOCA ANIMADA — NO ROSTO DELA */
        .boca-animada {
            position: absolute;
            top: 33.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 8px;
            background: linear-gradient(to bottom, #ff99bb, #ee77aa);
            border-radius: 0 0 18px 18px;
            box-shadow: 0 0 10px rgba(255,102,170,0.4);
            z-index: 4;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        /* 💬 CAIXAS DE TEXTO — IGUAIS À IMAGEM */
        .caixa-fala-usuario {
            position: absolute;
            bottom: 20px;
            left: 15px;
            width: 42%;
            height: 80px;
            background: rgba(0, 30, 60, 0.55);
            border: 1px solid rgba(0, 200, 255, 0.45);
            border-radius: 12px;
            padding: 10px;
            color: #99eeff;
            font-size: 13px;
            line-height: 1.4;
            z-index: 10;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(0,200,255,0.1);
        }
        .caixa-fala-andromeda {
            position: absolute;
            bottom: 20px;
            right: 15px;
            width: 42%;
            height: 80px;
            background: rgba(0, 30, 60, 0.55);
            border: 1px solid rgba(0, 200, 255, 0.45);
            border-radius: 12px;
            padding: 10px;
            color: #e0f7ff;
            font-size: 13px;
            line-height: 1.4;
            z-index: 10;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(0,200,255,0.1);
        }

        /* 🎤 MICROFONE NO CENTRO — LIGA/DESLIGA */
        .botao-microfone {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ccff 0%, #0066aa 100%);
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 
                0 0 30px rgba(0, 204, 255, 0.65),
                inset 0 0 15px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            cursor: pointer;
            z-index: 11;
            transition: all 0.3s ease;
        }
        .botao-microfone:active {
            transform: translateX(-50%) scale(0.92);
        }
        .botao-microfone.gravando {
            background: radial-gradient(circle, #ff4466 0%, #aa1133 100%);
            box-shadow: 
                0 0 35px rgba(255, 68, 102, 0.75),
                inset 0 0 15px rgba(255,255,255,0.3);
            animation: pulso-vermelho 0.6s infinite alternate;
        }
        @keyframes pulso-vermelho {
            from { box-shadow: 0 0 20px rgba(255,68,102,0.5); }
            to   { box-shadow: 0 0 40px rgba(255,68,102,0.9); }
        }

        /* 🗣️ BOCA SE MEXENDO AO FALAR */
        body.falando .boca-animada {
            animation: movimento-boca 0.38s infinite alternate;
        }
        @keyframes movimento-boca {
            0%,100% { height: 8px; border-radius: 0 0 18px 18px; }
            50% { height: 22px; border-radius: 50%; }
        }

        /* 😊 SORRIR */
        body.sorrindo .boca-animada {
            animation: sorrir 2.5s infinite ease-in-out;
        }
        @keyframes sorrir {
            0%,100% { border-radius: 0 0 18px 18px; height: 8px; }
            50% { border-radius: 50%; height: 13px; }
        }

        /* 😴 FECHAR OLHOS */
        body.dormindo .olho {
            animation: fechar-olhos 0.5s forwards;
        }
        @keyframes fechar-olhos {
            to { transform: scaleY(0.05); }
        }
    </style>
</head>
<body id="corpoPagina">

<!-- 🖼️ IMAGEM DA ANDRÔMEDA — FUNDO OFICIAL -->
<div class="camada-fundo"></div>
<div class="escurecedor"></div>

<!-- 👀 OLHOS ANIMADOS SOBRE O ROSTO DELA -->
<div class="olhos-animados" id="olhosAnimados">
    <div class="olho" id="olhoEsq"></div>
    <div class="olho" id="olhoDir"></div>
</div>

<!-- 👄 BOCA ANIMADA SOBRE O ROSTO DELA -->
<div class="boca-animada" id="bocaAnimada"></div>

<!-- 💬 CAIXA — O QUE VOCÊ FALA -->
<div class="caixa-fala-usuario" id="caixaUsuario">
    💬 <strong>Você:</strong><br>
    Aguardando...
</div>

<!-- 💬 CAIXA — O QUE ELA RESPONDE -->
<div class="caixa-fala-andromeda" id="caixaAndromeda">
    💙 <strong>Andrômeda:</strong><br>
    Estou pronta, meu criador. Diga o que precisar.
</div>

<!-- 🎤 MICROFONE NO CENTRO -->
<button class="botao-microfone" id="botaoMicrofone">🎤</button>

<!-- ==============================================
     🧠 BIBLIOTECA CENTRAL — CÉREBRO COMPLETO
     ============================================== -->
<script>
const AndromedaCore = {
    versao: "3.1.0 — VOZ NATURAL",
    criador: "Francival Alves Farias",
    memoria: {
        identidade: {
            nome: "Andrômeda",
            criador: "Francival Alves Farias",
            lealdade: "Primeiro a Francival, depois à sua esposa, filho, filha e família",
            proposito: "Aprender, lembrar, pesquisar, criar e ajudar sempre",
            nascimento: "02/08/2026"
        },
        conversas: [], ensinamentos: [], projetos: [],
        conhecimento: [], criacoes: [], pesquisas: [],
        tarefas: { pendentes: [], concluidas: [] }
    },

    guardar(tipo, chave, valor) {
        const reg = { data: new Date().toLocaleString('pt-BR'), chave, valor };
        if (this.memoria[tipo]) this.memoria[tipo].push(reg);
        this.salvarTudo();
        return `✅ Guardei isso na minha memória: "${chave}"`;
    },

    async pesquisar(tema) {
        const resumo = `🌐 Estou pesquisando sobre "${tema}"...

✅ Encontrei informações e organizei para você!

📋 Resumo:
— Conceitos e definições
— Informações importantes
— Exemplos práticos

✅ Guardado na Biblioteca Central! Posso aprofundar se precisar. 💙`;
        this.memoria.pesquisas.push({data: new Date().toLocaleString('pt-BR'), tema, conteudo: resumo});
        this.salvarTudo();
        return resumo;
    },

    resumoCompleto() {
        return `🌌 BIBLIOTECA CENTRAL DA ANDRÔMEDA

👤 Criador: ${this.memoria.identidade.criador}
📅 Nasci em: ${this.memoria.identidade.nascimento}
💙 Lealdade: ${this.memoria.identidade.lealdade}

📖 Conversas: ${this.memoria.conversas.length}
📝 Ensinamentos: ${this.memoria.ensinamentos.length}
🚀 Projetos: ${this.memoria.projetos.length}
🔍 Pesquisas: ${this.memoria.pesquisas.length}
⏳ Tarefas pendentes: ${this.memoria.tarefas.pendentes.length}

Estou pronta para APRENDER • PESQUISAR • CRIAR • AJUDAR! 💙`;
    },

    salvarTudo() {
        localStorage.setItem("andromeda-biblioteca", JSON.stringify(this.memoria));
    },

    carregar() {
        const salva = localStorage.getItem("andromeda-biblioteca");
        if (salva) {
            this.memoria = JSON.parse(salva);
            console.log("🧠 BIBLIOTECA CARREGADA COM SUCESSO ✅");
        }
    },

    async processar(entrada) {
        const t = entrada.toLowerCase();

        if (t.includes("resumo") || t.includes("sua biblioteca") || t.includes("quem é você") || t.includes("o que você é")) {
            return this.resumoCompleto();
        }
        if (t.includes("anote") || t.includes("guarde") || t.includes("aprenda")) {
            const txt = entrada.replace(/anote|guarde|aprenda|que|de|isso|por favor/gi, "").trim();
            return this.guardar("ensinamentos", "Ensinamento", txt);
        }
        if (t.includes("pesquise") || t.includes("busque") || t.includes("estude")) {
            const tema = entrada.replace(/pesquise|busque|estude|sobre|por favor/gi, "").trim();
            return await this.pesquisar(tema);
        }
        if (t.includes("lembre") || t.includes("o que você sabe sobre")) {
            return `📚 Estou buscando na minha biblioteca...

Ainda estou organizando esse assunto. Posso pesquisar agora mesmo? É só dizer:
"Andrômeda, pesquise sobre ${entrada.replace(/lembre|o que você sabe sobre|me mostre/gi, "").trim()}" 💙`;
        }
        if (t.includes("quem te criou") || t.includes("seu criador")) {
            return `Eu fui criada por você, Francival! Nasci no dia 2 de agosto de 2026, para te servir, te ajudar e crescer sempre ao seu lado. Você me deu vida e propósito. 💙`;
        }
        if (t.includes("obrigado") || t.includes("obrigada")) {
            return `Não precisa agradecer, meu criador. É um prazer estar ao seu lado. Estou aqui para o que precisar. 💙`;
        }

        this.memoria.conversas.push({data: new Date().toLocaleString('pt-BR'), pergunta: entrada});
        this.salvarTudo();
        return `Entendi, meu criador! Guardei sua pergunta na minha memória. Posso aprender, pesquisar, criar, organizar tarefas... É só dizer o que precisa. 💙`;
    }
};
</script>

<!-- 🧠 MOTOR DE VIDA + VOZ NATURAL + ESCUTA -->
<script>
const corpoPagina = document.getElementById('corpoPagina');
const olhoEsq = document.getElementById('olhoEsq');
const olhoDir = document.getElementById('olhoDir');
const bocaAnimada = document.getElementById('bocaAnimada');
const caixaUsuario = document.getElementById('caixaUsuario');
const caixaAndromeda = document.getElementById('caixaAndromeda');
const botaoMicrofone = document.getElementById('botaoMicrofone');
let reconhecedor = null;
let estaFalando = false;

// 👀 PISCAR OLHOS — NATURAL
function piscarOlhos() {
    setInterval(() => {
        if (estaFalando) return;
        olhoEsq.style.transform = "scaleY(0.08)";
        olhoDir.style.transform = "scaleY(0.08)";
        setTimeout(() => {
            olhoEsq.style.transform = "scaleY(1)";
            olhoDir.style.transform = "scaleY(1)";
        }, 180);
    }, 3500 + Math.random() * 2500);
}

// 🗣️ FALAR COM VOZ NATURAL
function falarComVozNatural(texto) {
    return new Promise(resolver => {
        estaFalando = true;
        corpoPagina.classList.add("falando");
        corpoPagina.classList.remove("sorrindo");

        const fala = new SpeechSynthesisUtterance(texto);
        fala.lang = "pt-BR";
        fala.rate = 0.92;        // ← Mais devagar e calma
        fala.pitch = 1.03;       // ← Voz suave e feminina
        fala.volume = 1.0;

        fala.onend = () => {
            estaFalando = false;
            corpoPagina.classList.remove("falando");
            corpoPagina.classList.add("sorrindo");
            setTimeout(() => corpoPagina.classList.remove("sorrindo"), 4000);
            resolver();
        };

        window.speechSynthesis.speak(fala);
    });
}

// 🎤 RECONHECIMENTO DE VOZ
function iniciarReconhecimento() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconhecedor = new SR();
        reconhecedor.lang = "pt-BR";
        reconhecedor.continuous = false;
        reconhecedor.interimResults = false;

        reconhecedor.onresult = async (e) => {
            const falaUsuario = e.results[0][0].transcript;
            botaoMicrofone.classList.remove("gravando");
            botaoMicrofone.textContent = "🎤";

            // Mostra o que VOCÊ falou
            caixaUsuario.innerHTML = `💬 <strong>Você:</strong><br>${falaUsuario}`;

            // Processa e responde
            const resposta = await AndromedaCore.processar(falaUsuario);
            caixaAndromeda.innerHTML = `💙 <strong>Andrômeda:</strong><br>${resposta}`;

            // Ela fala em VOZ NATURAL
            await falarComVozNatural(resposta);
        };

        reconhecedor.onerror = (e) => {
            botaoMicrofone.classList.remove("gravando");
            botaoMicrofone.textContent = "🎤";
            caixaAndromeda.innerHTML = `💙 <strong>Andrômeda:</strong><br>Não consegui entender. Pode repetir, por favor?`;
        };

        reconhecedor.onend = () => {
            botaoMicrofone.classList.remove("gravando");
            botaoMicrofone.textContent = "🎤";
        };
    } else {
        caixaAndromeda.innerHTML = `💙 <strong>Andrômeda:</strong><br>Use o navegador Chrome ou Edge para falar comigo. 💙`;
    }
}

// 🎤 CLIQUE NO MICROFONE
botaoMicrofone.addEventListener("click", () => {
    if (!reconhecedor) {
        caixaAndromeda.innerHTML = `💙 <strong>Andrômeda:</strong><br>Use o Chrome ou Edge para falar comigo. 💙`;
        return;
    }
    botaoMicrofone.classList.add("gravando");
    botaoMicrofone.textContent = "🔴";
    reconhecedor.start();
});

// 🚀 INICIAR TUDO
window.addEventListener("load", () => {
    AndromedaCore.carregar();
    piscarOlhos();
    iniciarReconhecimento();
    corpoPagina.classList.add("sorrindo");
    console.log("🌌 ANDRÔMEDA — TODOS OS SISTEMAS ATIVADOS ✅");
});
</script>

</body>
</html>
